root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/educraft-api ./cmd/api"
bin = "./tmp/educraft-api"
full_bin = "./tmp/educraft-api"
include_ext = ["go", "sql"]
exclude_dir = ["tmp", "vendor"]
delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = 500

[log]
time = true

[screen]
clear_on_rebuild = true
